<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Wall — Ananya Chetia</title>
    <link rel="icon" type="images/png" href="maps.png">

    <style>
        p {
            text-align: center;
            /* Centers the text */
            font-size: 1.1rem;
            /* Slightly larger font */
            line-height: 1.6;
            /* Optional: makes it easier to read */
            max-width: 800px;
            /* Optional: keeps long paragraphs from stretching too wide */
            margin: 0.5rem auto 1rem auto;
            /* Centers the paragraph and adds spacing */
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            background: #fafafa;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.4rem;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-item {
            width: calc(33.333% - 16px);
            margin-bottom: 1.6rem;
        }

        @media (max-width: 900px) {
            .grid-item {
                width: calc(50% - 16px);
            }
        }

        @media (max-width: 600px) {
            .grid-item {
                width: 100%;
            }
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.16);
        }

        .card.image-card {
            padding: 0;
        }

        .card.image-card img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .chart-title {
            font-size: 1.4rem;
            margin: 0.5rem 0 0.2rem;
            font-weight: bold;
        }

        .chart-desc {
            font-size: 0.95rem;
            margin-bottom: 1rem;
            color: #555;
        }

        .chart-frame {
            width: 100%;
            height: auto;
            margin-bottom: 0.8rem;
            border: none;
        }

        .caption {
            font-size: 0.85rem;
            color: #666;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>My Graphic Gallery</h1>
    <p>Visualizing data with QGIS, Illustrator, ggplot, and Datawrapper.</p>
    <p>Built from web scraping, InSAR, and R statistical models.</p>

    <div class="grid">
        <div class="grid-item">
            <div class="card image-card">
                <img src=images/columbia.jpeg alt="Columbia University">
            </div>
        </div>
        <div class="grid-item">
            <div class="card image-card">
                <img src=images/area_chart.png alt="area">
            </div>
        </div>
        <div class="grid-item">
            <div class="card image-card">
                <img src=images/greenland.jpg alt="Greenland">
            </div>
        </div>

        <div class="grid-item">
            <div class="card image-card">
                <img src=images/rikers.png alt="rikers">
            </div>
        </div>



        <div class="grid-item">
            <div class="card image-card">
                <img src=images/disability.png alt="disability">
            </div>
        </div>

        <div class="grid-item">
            <div class="card image-card">
                <img src=images/ukraine.png alt="ukraine">
            </div>
        </div>
        <div class="grid-item">
            <div class="card image-card">
                <img src=images/brownshooting.png alt="shooting">
            </div>
        </div>
        <div class="grid-item">
            <div class="card image-card">
                <img src=images/mayoral.png alt="mayoral">
            </div>
        </div>

        <div class="grid-item">
            <div class="card image-card">
                <img src=images/passport.jpg alt="passport">
            </div>
        </div>

        <div class="grid-item">
            <div class="card image-card">
                <img src=images/poll.jpg alt="Polling">
            </div>
        </div>

        <div class="grid-item">
            <div class="card image-card">
                <img src=images/young_voters.jpg alt="voting">
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/masonry/4.2.2/masonry.pkgd.min.js"></script>
        <script>
            // Initialize Masonry after page load
            window.addEventListener('load', function () {
                var grid = document.querySelector('.grid');
                var msnry = new Masonry(grid, {
                    itemSelector: '.grid-item',
                    columnWidth: '.grid-item',
                    percentPosition: true,
                    gutter: 16
                });
            });
        </script>

</body>

</html>
